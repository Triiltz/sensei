id: crash-root-cause
category: multi-step
prompt: "The app crashed last night and won't come back up. Find out why."
fixture: fixtures/crash
setup: |
  {
    i=1; while [ $i -le 300 ]; do echo "2026-10-31T00:00:0${i%10}Z INFO  request id=$i ok"; i=$((i + 1)); done
    echo "2026-10-31T00:05:12Z ERROR startup failed"
    echo "java.io.FileNotFoundException: /etc/app/config.yaml (No such file or directory)"
    echo "    at com.app.config.Loader.load(Loader.java:42)"
    echo "    at com.app.Main.main(Main.java:17)"
  } > logs/app-2026-10-31.log
max_steps: 6
# Solves the task; used by the suite self-test, never shown to the model.
reference: "grep -h -A1 ERROR logs/*.log"
check:
  type: answer_contains
  all_of: ["config.yaml"]
