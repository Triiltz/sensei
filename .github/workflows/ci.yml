name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # No test calls a real API: providers are faked with httptest.
      - run: go test -race ./...
      - name: Fuzz the command classifier
        run: go test ./internal/policy -run '^$' -fuzz FuzzClassify -fuzztime 30s
